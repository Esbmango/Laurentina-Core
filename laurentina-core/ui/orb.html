<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: laurentina-avatar:; media-src 'self' data: blob: laurentina-avatar:; connect-src 'self' laurentina-avatar:; object-src 'none'; base-uri 'none'">
  <title>Laurentina · 陪伴</title>
  <link rel="stylesheet" href="orb.css">
  <script src="i18n.js" defer></script>
  <script src="avatars/render_quality.js" defer></script>
  <script src="avatars/avatar-renderer.js" defer></script>
  <script src="companion-interaction.js" defer></script>
  <script src="orb.js" defer></script>
</head>
<body>
  <div class="orb-widget">
    <button id="orb-open" class="orb" aria-label="单击轻触，双击打开聊天，拖动移动；回车轻触，Shift加回车打开聊天" title="单击轻触 · 双击聊天 · 拖动移动"><canvas id="orb-particles" aria-hidden="true"></canvas><span id="orb-avatar" class="orb-avatar" hidden></span></button>
    <button id="companion-artwork" class="illustration-button" aria-label="单击轻触，双击打开聊天，拖动移动；回车轻触，Shift加回车打开聊天" title="单击轻触 · 双击聊天 · 拖动移动" hidden></button>
    <div id="orb-name" class="orb-name">劳纶缇娜</div>
    <p id="orb-status" class="orb-status" aria-live="polite">随时在这里</p>
    <div class="orb-controls"><button id="orb-main" aria-label="打开主面板" title="打开主面板"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button><button id="orb-record" class="record" aria-label="录音输入" title="录音输入"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button><button id="orb-hide" aria-label="隐藏悬浮球" title="隐藏悬浮球"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button></div>
  </div>
</body>
</html>
